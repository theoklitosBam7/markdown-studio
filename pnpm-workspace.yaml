packages:
  - packages/*
  - apps/*

minimumReleaseAge: 4320
nodeVersionFile: .node-version

allowBuilds:
  cypress: true
  electron: true
  electron-winstaller: false
  esbuild: true
  sharp: true
  simple-git-hooks: false
  unrs-resolver: true

catalog:
  typescript: ~6.0.3
  vite: ^8.1.5
  vitest: ^4.1.10
  vue-tsc: ^3.3.8
  '@types/node': ^24.13.2
  '@vitejs/plugin-vue': ^6.0.8
  vite-plugin-vue-devtools: ^8.2.1
  mermaid: ^11.16.0
