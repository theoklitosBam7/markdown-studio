packages:
  - packages/*
  - apps/*

minimumReleaseAge: 1440 # 1 day, in minutes
nodeVersionFile: .node-version

allowBuilds:
  cypress: true
  electron: true
  electron-winstaller: false
  esbuild: true
  sharp: true
  simple-git-hooks: false
  unrs-resolver: true

catalog:
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vue-tsc: ^3.3.8
  '@types/node': ^24.13.2
  '@vitejs/plugin-vue': ^6.0.8
  vite-plugin-vue-devtools: ^8.2.1
  mermaid: ^11.16.0
  vite-plus: 0.2.9
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
