name: Version Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Open version pull request
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      - name: Create or update version pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: vpr changeset:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
